<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>武汉公司基地分布</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
    <style>
        html, body { margin: 0; height: 100%; }
        #container { width: 100%; height: 100%; }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #666;
            background: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            z-index: 999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ 地图加载中...</div>
    <div id="container"></div>

    <script>
        const AMAP_KEY = '68793e3c2509e3cc24cd86a04f55175f';
        const AMAP_SECURITY = 'e093383a2c9378174173d663ea800dbb';

        const baseLocations = [
            { name: '汉阳基地', lng: 114.256798, lat: 30.531055 }
        ];

        const GEO_URL = './wuhan.geojson';

        if (AMAP_SECURITY && AMAP_SECURITY !== '请替换为你的安全密钥') {
            window._AMapSecurityConfig = { securityJsCode: AMAP_SECURITY };
        }

        function loadAMap() {
            return new Promise((resolve, reject) => {
                if (document.querySelector('script[src*="webapi.amap.com/maps"]')) {
                    return resolve();
                }
                const script = document.createElement('script');
                script.src =
                    `https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}&plugin=AMap.ToolBar,AMap.GeoJSON`;
                script.onload = resolve;
                script.onerror = () => reject(new Error('高德地图 API 加载失败'));
                document.head.appendChild(script);
            });
        }

        loadAMap()
            .then(() => {
                document.getElementById('loading').style.display = 'none';

                const map = new AMap.Map('container', {
                    center: [114.2986, 30.5944],
                    zoom: 11,
                    mapStyle: 'amap://styles/light',
                    viewMode: '2D'
                });

                fetch(GEO_URL)
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.json();
                    })
                    .then(geoJson => {
                        if (!geoJson.features || geoJson.features.length === 0) {
                            throw new Error('GeoJSON 数据为空');
                        }
                        const geoJsonLayer = new AMap.GeoJSON({
                            geoJSON: geoJson,
                            getPolygon: function(geojson, lnglats) {
                                const colors = [
                                    'rgba(255, 193, 7, 0.06)',
                                    'rgba(0, 188, 212, 0.06)',
                                    'rgba(76, 175, 80, 0.06)',
                                    'rgba(255, 87, 34, 0.05)',
                                    'rgba(156, 39, 176, 0.05)',
                                    'rgba(63, 81, 181, 0.06)'
                                ];
                                const color = colors[Math.floor(Math.random() * colors.length)];
                                return new AMap.Polygon({
                                    path: lnglats,
                                    strokeColor: '#3366FF',
                                    strokeWeight: 2.5,
                                    fillColor: color,
                                    strokeStyle: 'solid'
                                });
                            }
                        });
                        map.add(geoJsonLayer);
                        console.log('✅ 区县边界绘制完成');
                    })
                    .catch(err => {
                        console.error('❌ 加载 GeoJSON 失败：', err);
                        document.getElementById('loading').style.display = 'block';
                        document.getElementById('loading').innerHTML =
                            `❌ 加载边界数据失败：${err.message}<br/>请检查文件是否存在。`;
                        document.getElementById('loading').style.color = '#e74c3c';
                    });

                baseLocations.forEach(item => {
                    const marker = new AMap.Marker({
                        position: [item.lng, item.lat],
                        title: item.name,
                        label: {
                            content: item.name,
                            direction: 'top',
                            offset: new AMap.Pixel(0, 6)
                        }
                    });
                    marker.setMap(map);

                    marker.on('click', () => {
                        new AMap.InfoWindow({
                            content: `<h4>${item.name}</h4><p>经度：${item.lng}<br/>纬度：${item.lat}</p>`,
                            offset: new AMap.Pixel(0, -30)
                        }).open(map, [item.lng, item.lat]);
                    });

                    // 5公里半径圆（原有）
                    const circle5km = new AMap.Circle({
                        center: [item.lng, item.lat],
                        radius: 5000,
                        strokeColor: '#000000',
                        strokeWeight: 1,
                        fillColor: 'rgba(0,0,0,0)',
                        fillOpacity: 0
                    });
                    circle5km.setMap(map);

                    // ★ 新增：10公里半径圆 ★
                    const circle10km = new AMap.Circle({
                        center: [item.lng, item.lat],
                        radius: 10000,
                        strokeColor: '#000000',
                        strokeWeight: 1,
                        fillColor: 'rgba(0,0,0,0)',
                        fillOpacity: 0
                    });
                    circle10km.setMap(map);
                });

                map.addControl(new AMap.ToolBar({ position: 'RT' }));
                map.setFitView();
                console.log('🎉 地图加载完成！');
            })
            .catch(err => {
                document.getElementById('loading').innerHTML =
                    `❌ 高德地图加载失败：${err.message}`;
                document.getElementById('loading').style.color = '#e74c3c';
                console.error('❌', err);
            });
    </script>
</body>
</html>
